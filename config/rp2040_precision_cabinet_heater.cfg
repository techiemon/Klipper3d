
[mcu cabinet_heater_pico]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E664B49507598426-if00
restart_method: command

# MCU internal temperature (loads heaters)
[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: cabinet_heater_pico

# Now safe to load AHT10 driver (needs 'heaters' to exist)
[aht10]

# Ambient sensor: AHT20 on RP2040 I2C1 (GP6 SDA, GP7 SCL)
[temperature_sensor my_ambient]
sensor_type: AHT10
i2c_mcu: cabinet_heater_pico
i2c_bus: i2c1a
i2c_address: 56

[temperature_sensor element_temp] 
sensor_type: MAX6675
sensor_pin: cabinet_heater_pico:gpio5
spi_bus: spi0b
spi_speed: 4000000

[output_pin ssr]
pin: cabinet_heater_pico:gpio14
pwm: True
cycle_time: 0.50            # start with on/off for testing
value: 0
shutdown_value: 0

[output_pin fan_relay]
pin: !cabinet_heater_pico:gpio15
pwm: False
value: 0
shutdown_value: 0

[rp2040_precision_cabinet_heater]
mcu: cabinet_heater_pico
ssr_output: ssr
fan_output: fan_relay
ambient_sensor: temperature_sensor my_ambient
element_sensor: temperature_sensor element_temp
mcu_temp_sensor: temperature_sensor mcu_temp


[gcode_macro QUERY_AMBIENT]
gcode:
  RESPOND TYPE=echo MSG="Ambient {printer['temperature_sensor my_ambient'].temperature|float|round(2)} C"