# RP2040 Gearmotor Filament Cutter Configuration
# This configuration supports dual filament cutters for a dual extruder setup
# Each cutter uses a DRV8871 H-bridge motor driver and two endstop switches

# MCU Configuration for RP2040
[mcu rp2040_cutter]
serial: /dev/serial/by-id/usb-Klipper_rp2040_*  # Update with your actual serial ID
restart_method: command

# Filament Cutter for Extruder 0
[filament_cutter extruder0]
forward_pin: rp2040_cutter:gpio2      # H-bridge forward control pin
reverse_pin: rp2040_cutter:gpio3      # H-bridge reverse control pin
park_endstop_pin: ^rp2040_cutter:gpio4    # Park position endstop (pullup enabled)
cut_endstop_pin: ^rp2040_cutter:gpio5     # Cut position endstop (pullup enabled)
operation_timeout: 120.0              # Maximum time for complete operation (seconds)
endstop_timeout: 30.0                 # Maximum time to wait for each endstop (seconds)
debounce_time: 0.050                  # Debounce time for noisy switches (50ms default)

# Filament Cutter for Extruder 1
[filament_cutter extruder1]
forward_pin: rp2040_cutter:gpio6      # H-bridge forward control pin
reverse_pin: rp2040_cutter:gpio7      # H-bridge reverse control pin
park_endstop_pin: ^rp2040_cutter:gpio8    # Park position endstop (pullup enabled)
cut_endstop_pin: ^rp2040_cutter:gpio9     # Cut position endstop (pullup enabled)
operation_timeout: 120.0              # Maximum time for complete operation (seconds)
endstop_timeout: 30.0                 # Maximum time to wait for each endstop (seconds)
debounce_time: 0.050                  # Debounce time for noisy switches (50ms default)

# Optional: Status LED indicators
[output_pin cutter0_status_led]
pin: rp2040_cutter:gpio10
pwm: False
value: 0

[output_pin cutter1_status_led]
pin: rp2040_cutter:gpio11
pwm: False
value: 0

# GCode Macros for easy operation
[gcode_macro CUT_FILAMENT_E0]
description: Cut filament for extruder 0
gcode:
    RUN_CUTTER CUTTER=extruder0

[gcode_macro CUT_FILAMENT_E1]
description: Cut filament for extruder 1
gcode:
    RUN_CUTTER CUTTER=extruder1

[gcode_macro PARK_ALL_CUTTERS]
description: Park both filament cutters
gcode:
    PARK_CUTTER CUTTER=extruder0
    PARK_CUTTER CUTTER=extruder1

[gcode_macro QUERY_ALL_CUTTERS]
description: Query status of both filament cutters
gcode:
    QUERY_CUTTER CUTTER=extruder0
    QUERY_CUTTER CUTTER=extruder1

# Hardware Notes:
# - DRV8871 H-bridge supports 6.5V to 45V motor voltage
# - 3.6A peak current drive capability
# - Use separate 3.3V power supply for RP2040 peripherals (recommended 30A capacity)
# - Endstop switches are normally open (NO), active high when triggered
# - H-bridge pins accept digital on/off signals (PWM capability available but not used)
# - Motor power should be 12V as specified in the design
# - Ensure proper wiring with strain relief and color coding
