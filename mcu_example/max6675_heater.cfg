# MCU
[mcu my_heater]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E664B49507598426-if00


# MCU internal temperature (loads heaters)
[temperature_sensor mcu_temp]
sensor_type: temperature_mcu
sensor_mcu: my_heater

# Now safe to load AHT10 driver (needs 'heaters' to exist)
[aht10]

# Ambient sensor: AHT20 on RP2040 I2C1 (GP6 SDA, GP7 SCL)
[temperature_sensor my_ambient]
sensor_type: AHT10
i2c_mcu: my_heater
i2c_bus: i2c1a
i2c_address: 56
# Optional:
# rate: 1.0

# Heater using MAX6675 on SPI0 (GP2 SCLK, GP3 CS, GP4 MISO)
[max6675_heater]
mcu: my_heater
cs_pin: gpio3
ssr_pin: gpio14
fan_pin: gpio8
fan_active_high: True
ambient_sensor: temperature_sensor my_ambient
# Optional:
# target_air: 40.0
# element_offset: 10.0

# If your fan wiring is active-low, set fan_active_high: False.
# After saving, send RESTART, then:
# QUERY_HEATER to see air/element temps.
# SET_HEATER_POWER S=0.2 to verify SSR PWM and that the fan turns on when heating.

# Add the following to your [include] or printer.cfg
#[include config/max6675_heater.cfg]

# 2. Python Host Module
# A new Klipper extension 
# klippy/extras/max6675_heater.py
#  was created. This module:

# Registers GCODE commands to set temperature, set power, and query the heater.
# Talks to the MCU using the new 
# max6675_read
#  and 
# ssr_pwm_set
#  commands.
# Implements a simple on/off control loop for demonstration (can be upgraded to PID, etc.).
# Example GCODEs:
# SET_HEATER_TEMP S=100 — Set target temperature to 100°C.
# SET_HEATER_POWER S=0.5 — Set heater power to 50%.
# QUERY_HEATER
#  — Report current temp and power.

# 3. How to Use
# Edit your printer.cfg (or include the provided config).
# Set the correct serial device and GPIO pins.
# Restart Klipper.


# • AHT20 requires 3.3V and pull-ups (typically 4.7k) on SDA/SCL to 3.3V. Many breakout boards include them; confirm if your board does.
# • RP2040 “hardware” I2C default pairs: I2C0 (GP4 SDA, GP5 SCL) and I2C1 (GP6 SDA, GP7 SCL). Since MAX6675 uses GP4 as MISO, prefer I2C1 or software I2C to avoid conflicts.
# • Ensure the ambient_sensor in [max6675_heater ...] matches the exact section header of your AHT (e.g., aht10 my_ambient).