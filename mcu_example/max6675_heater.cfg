# Ambient sensor: AHT20 on RP2040 I2C1 (GP6 SDA, GP7 SCL)
[aht10 my_ambient]
i2c_bus: i2c1a
i2c_address: 0x38
# Optional:
# rate: 1.0

# Heater using MAX6675 on SPI0 (GP2 SCLK, GP3 CS, GP4 MISO)
[max6675_heater my_heater]
mcu: mcu
cs_pin: gpio3
ssr_pin: gpio14
fan_pin: gpio8
fan_active_high: True
ambient_sensor: aht10 my_ambient
# Optional:
# target_air: 40.0
# element_offset: 10.0
# If your fan wiring is active-low, set fan_active_high: False.
# After saving, send RESTART, then:
# QUERY_HEATER to see air/element temps.
# SET_HEATER_POWER S=0.2 to verify SSR PWM and that the fan turns on when heating.

# Add the following to your [include] or printer.cfg
#[include config/max6675_heater.cfg]

# 2. Python Host Module
# A new Klipper extension 
# klippy/extras/max6675_heater.py
#  was created. This module:

# Registers GCODE commands to set temperature, set power, and query the heater.
# Talks to the MCU using the new 
# max6675_read
#  and 
# ssr_pwm_set
#  commands.
# Implements a simple on/off control loop for demonstration (can be upgraded to PID, etc.).
# Example GCODEs:
# SET_HEATER_TEMP S=100 — Set target temperature to 100°C.
# SET_HEATER_POWER S=0.5 — Set heater power to 50%.
# QUERY_HEATER
#  — Report current temp and power.

# 3. How to Use
# Edit your printer.cfg (or include the provided config).
# Set the correct serial device and GPIO pins.
# Restart Klipper.
# Test with the GCODE commands above.
# Let me know if you want a more advanced control loop (like PID), or if you’d like help wiring the hardware, building/flashing the firmware, or troubleshooting the setup!