# Example Klipper config for RP2040 with MAX6675 and SSR PWM
[mcu pico]
serial: /dev/serial/by-id/usb-Klipper_rp2040_*  # Update with your device path

[heater_generic my_heater]
# This section is for the host-side heater logic, but we will use our custom extension

[max6675_heater my_heater]
mcu: pico
cs_pin: <spi_cs_pin>          # e.g. gpio1
ssr_pin: <pwm_pin>            # e.g. gpio2
pwm_freq: 1.0                 # 1 Hz PWM frequency
max_temp: 300.0
min_temp: 0.0
fan_pin: <fan_gpio_pin>       # optional; GPIO to drive fan
fan_active_high: True         # set False if your fan relay is active-low
cool_ratio: 0.10              # fan stops when |element-air|/max <= 10%

dht22_pin: <pi_gpio_pin>      # e.g. 4 (BCM numbering, Pi pin for DHT22)
dht22_interval: 2.0           # seconds between DHT22 reads
element_offset: 10.0          # Element temp above air temp (degC)
target_air: 40.0              # Target air temp (degC)

# PID parameters for element temp control
pid_kp: 2.0
pid_ki: 0.1
pid_kd: 1.0

# Add the following to your [include] or printer.cfg
#[include config/max6675_heater.cfg]
